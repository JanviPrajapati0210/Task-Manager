name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ===========================================================================
  # Job 1: Backend Automated Tests
  # ===========================================================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install backend dependencies
        run: npm install

      - name: Run backend automated tests
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_jwt_secret_key_98765
          GOOGLE_CLIENT_ID: ci-mock-google-client-id.apps.googleusercontent.com
          PORT: 5099
        run: npm test

  # ===========================================================================
  # Job 2: Frontend Build Check
  # ===========================================================================
  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: |
          cd client
          npm install

      - name: Build React frontend
        run: |
          cd client
          npm run build
